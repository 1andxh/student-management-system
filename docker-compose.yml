services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://sms:sms@db:5432/sms
      DATABASE_URL_TEST: postgresql+asyncpg://sms:sms@db-test:5432/sms_test
    ports:
      - "8000:8000"
    volumes:
      # Only this directory is bind-mounted: alembic revision --autogenerate
      # writes migration files inside the container, and without this they'd
      # be stranded there instead of reaching the host/git. Deliberately not
      # bind-mounting the whole source tree — this project rebuilds on code
      # change (docker compose up --build), not hot-reload.
      - ./alembic/versions:/app/alembic/versions
      # Named volume, not a bind mount — persistent runtime data (uploaded
      # profile pictures), same shape as sms_db_data below, not source.
      - sms_uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: sms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms
    ports:
      - "5435:5432"
    volumes:
      - sms_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-test:
    image: postgres:17-alpine
    container_name: sms_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_test
    ports:
      - "5436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms_test"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sms_db_data:
  sms_uploads_data:
